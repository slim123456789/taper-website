<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'none'; img-src 'self' data:; font-src https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline'; media-src 'self'" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <script>if (self !== top) { try { top.location = self.location; } catch (e) {} }</script>
  <script src="/iab.js"></script>
  <script>
    // Real browser → straight to the App Store (no flash of the loading screen).
    if (!IAB.isInApp()) location.replace(IAB.APP_STORE_URL);
  </script>
  <title>Opening the App Store — Taper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --navy: #0B3954; --blue: #2374AB; --sky: #B8D0EB; }
    html, body { height: 100%; }
    body {
      font-family: 'DM Sans', -apple-system, sans-serif;
      background: var(--navy); color: #fff;
      min-height: 100vh; min-height: 100svh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 24px; text-align: center;
    }
    .logo { font-size: 40px; font-weight: 700; letter-spacing: -1px; margin-bottom: 22px; }
    .spinner {
      width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, 0.2); border-top-color: var(--sky);
      animation: spin 0.8s linear infinite; margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status { font-size: 15px; color: var(--sky); opacity: 0.9; }

    /* Fallback popup (same as the landing page) */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(6, 20, 30, 0.72);
      -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
      display: none; align-items: center; justify-content: center; padding: 24px; z-index: 1000;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #fff; color: var(--navy); border-radius: 22px; padding: 30px 24px 24px;
      max-width: 344px; width: 100%; text-align: left; position: relative;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.45); animation: pop 0.22s ease;
    }
    @keyframes pop { from { opacity: 0; transform: scale(0.94) translateY(10px); } to { opacity: 1; transform: none; } }
    .modal-close {
      position: absolute; top: 12px; right: 12px; width: 24px; height: 24px; border: none;
      background: rgba(11, 57, 84, 0.06); border-radius: 50%; font-size: 15px; color: var(--navy);
      cursor: pointer; line-height: 1; display: flex; align-items: center; justify-content: center;
    }
    .modal h2 { font-size: 18px; font-weight: 700; text-align: center; margin: 2px 18px 6px; }
    .modal .sub { font-size: 14px; color: #5b6b76; text-align: center; margin-bottom: 20px; }
    .modal ol { list-style: none; counter-reset: step; }
    .modal ol li {
      position: relative; padding: 12px 0 12px 44px; font-size: 15px; line-height: 1.35;
      border-top: 1px solid rgba(11, 57, 84, 0.08);
    }
    .modal ol li:first-child { border-top: none; }
    .modal ol li::before {
      counter-increment: step; content: counter(step);
      position: absolute; left: 0; top: 50%; transform: translateY(-50%);
      width: 28px; height: 28px; background: var(--blue); color: #fff; border-radius: 50%;
      display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700;
    }
    .modal strong { font-weight: 700; }
    .dots { display: inline-block; background: rgba(11, 57, 84, 0.08); border-radius: 6px; padding: 0 6px; font-weight: 700; letter-spacing: 1px; }
    .modal-btn {
      display: block; width: 100%; margin: 4px 0 14px; padding: 13px;
      background: var(--blue); color: #fff; border: none; border-radius: 12px;
      font-size: 16px; font-weight: 700; font-family: inherit; cursor: pointer;
    }
    .modal-btn:active { opacity: 0.9; }
    .modal-or { text-align: center; font-size: 11px; color: #8a99a3; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 10px; }
    .modal-link { display: block; width: 100%; margin-top: 14px; padding: 6px; background: none; border: none; color: var(--blue); font-size: 14px; font-weight: 600; font-family: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <div class="logo">taper</div>
  <div class="spinner"></div>
  <div class="status">Opening the App Store…</div>

  <div id="iabModal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="iabTitle">
    <div class="modal">
      <button id="iabClose" class="modal-close" aria-label="Close">&times;</button>
      <h2 id="iabTitle">Open in Safari to download</h2>
      <div class="sub">Instagram blocks App Store links in its in-app browser.</div>
      <button id="iabRetry" class="modal-btn">Open in Safari</button>
      <div class="modal-or">or do it manually</div>
      <ol>
        <li>Tap the <span class="dots">•••</span> button in the top-right corner</li>
        <li>Choose <strong>Open in external browser</strong></li>
      </ol>
      <button id="iabCopy" class="modal-link">Copy download link</button>
    </div>
  </div>

  <script>
    (function () {
      // Real browsers were already redirected in <head>; anything left here is an
      // in-app browser. Auto-fire the break-out to Safari, fall back to the popup.
      if (!IAB.isInApp()) { location.replace(IAB.APP_STORE_URL); return; }

      var modal    = document.getElementById('iabModal');
      var closeBtn = document.getElementById('iabClose');
      var retryBtn = document.getElementById('iabRetry');
      var copyBtn  = document.getElementById('iabCopy');

      function openModal() { modal.classList.add('open'); }
      function closeModal() { modal.classList.remove('open'); }

      if (retryBtn) retryBtn.addEventListener('click', function () { IAB.attemptDownload(openModal); });
      if (copyBtn) copyBtn.addEventListener('click', function () {
        IAB.copy(function () {
          copyBtn.textContent = 'Link copied ✓';
          setTimeout(function () { copyBtn.textContent = 'Copy download link'; }, 1800);
        });
      });
      if (closeBtn) closeBtn.addEventListener('click', closeModal);
      modal.addEventListener('click', function (e) { if (e.target === modal) closeModal(); });

      // Auto-trigger on load. If iOS drops the (gesture-less) scheme, the modal
      // appears with a one-tap "Open in Safari" retry.
      IAB.attemptDownload(openModal);
    })();
  </script>
</body>
</html>
